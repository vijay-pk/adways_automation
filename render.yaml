# Render Blueprint for Course Tutor (https://render.com/docs/blueprint-spec).
#
# Deploys the app from the root Dockerfile. The container runs
# `prisma migrate deploy && node dist/index.js`, so every deploy applies pending
# migrations before starting.
#
# PLAN: free (chosen deliberately). LIMITATIONS you accept on free:
# - No persistent disk. The WhatsApp Web linked-device session lives on the
#   container's ephemeral filesystem, so it is LOST on every restart/redeploy and
#   on spin-down — you will have to re-scan the QR. WhatsApp Web is therefore NOT
#   reliable on free; it works only until the next restart.
# - Free services spin down after ~15 min idle. While asleep, the long-lived
#   WhatsApp socket drops and the in-process job worker is paused; they resume on
#   the next request (after a cold start), but queued work waits until then.
# - Uploaded transcript files are also ephemeral. Set STORAGE_PROVIDER=supabase
#   (private bucket) so transcripts survive; "local" storage will be wiped.
# To make WhatsApp Web and the worker reliable, move to a paid plan and add a
# persistent disk mounted at /data (see git history for the starter+disk version).
#
# Secrets and connection strings are `sync: false`: set their values in the
# Render dashboard (Environment), never in this file.
#
# NOTE: if a service for this repo already exists, applying this Blueprint may
# create a SECOND service — attach it to the existing one or delete the manual one.

services:
  - type: web
    name: course-tutor
    runtime: docker
    plan: free
    region: singapore # closest Render region to the Supabase ap-northeast-2 database
    branch: main
    autoDeploy: true # deploy on every push to main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: groq
      # Session signing key: Render generates a strong value once and keeps it.
      - key: SESSION_SECRET
        generateValue: true
      # --- Set these in the Render dashboard (Environment) ---
      # Supabase Postgres. DATABASE_URL = transaction pooler (6543, pgbouncer=true);
      # DIRECT_URL = session pooler (5432) for migrations. Both need ?schema=tutor.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Public origin of this service, e.g. https://course-tutor.onrender.com
      # or your custom domain. Used for links and the Cloud API webhook URL.
      - key: APP_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Transcript storage: use "supabase" on free (local uploads are wiped on restart).
      - key: STORAGE_PROVIDER
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Embeddings (optional): "none", "openai_compatible", or "mock".
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      # WhatsApp Business Cloud API (optional; only if using that adapter).
      - key: WHATSAPP_CLOUD_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_CLOUD_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_CLOUD_APP_SECRET
        sync: false
      - key: WHATSAPP_CLOUD_VERIFY_TOKEN
        sync: false
